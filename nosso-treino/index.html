/div><div><h2>${w.t}</h2><p>${w.f}</p></div></div><div class="list">${w.e.map((e,i)=>ex(e,i)).join('')}</div><button class="btn primary" style="width:100%;margin-top:12px" id="${S.data.active?'finish':'start'}">${S.data.active?'Finalizar treino':'Iniciar treino '+id}</button>`}function ex(e,i){let done=S.data.active?.done?.[i]||0;return`<div class="ex"><div class="thumb">${svg()}</div><div><h4>${i+1}. ${e[0]}</h4><div class="chips"><span class="chip">▣ ${e[1]} séries</span><span class="chip r">↕ ${e[2]}</span><span class="chip t">◷ ${rest(e[3])}s</span></div></div><button class="open" data-i="${i}">${done?done+'/'+e[1]:'Abrir'}</button></div>`}function history(){let a=[...S.data.sessions].reverse();return`<div class="head"><small style="color:var(--mut)">Evolução neste aparelho</small><h2>Histórico</h2></div><div class="grid"><div class="card metric"><small>Treinos</small><strong>${a.length}</strong></div><div class="card metric"><small>Tempo total</small><strong>${a.reduce((n,s)=>n+Math.max(1,Math.round((s.end-s.start)/60000)),0)}<small> min</small></strong></div></div><div class="section"><h3>Últimas sessões</h3></div><div class="card">${a.length?a.map(s=>`<div class="histrow"><div class="badge">${s.id}</div><div><b>${W[s.id].t}</b><p>${s.loc?'Local confirmado':'Local não confirmado'} • ${Math.max(1,Math.round((s.end-s.start)/60000))} min</p></div><small>${new Date(s.end).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</small></div>`).join(''):'Nenhum treino concluído.'}</div>`}function control(){return`<div class="head"><small style="color:var(--mut)">Deslize os painéis</small><h2>Central de Controle</h2></div><div class="controls"><div class="card ct"><div><i>◷</i><h3>Descanso</h3><p>Ajuste global dos intervalos.</p></div><div class="range"><div><span>Ajuste</span><b id="rv">${delta(S.data.set.rest)}</b></div><input id="rr" type="range" min="-15" max="30" step="15" value="${S.data.set.rest}"></div></div><div class="card ct"><div><i>⌖</i><h3>Raio da academia</h3><p>Distância para confirmar presença.</p></div><div class="range"><div><span>Raio</span><b id="gv">${S.data.gym.radius} m</b></div><input id="gr" type="range" min="80" max="500" step="20" value="${S.data.gym.radius}"></div></div></div><div class="section"><h3>Localização</h3></div><div class="card"><button class="btn primary" id="setgym">Atualizar academia para este local</button><button class="btn secondary" id="check" style="margin-left:6px">Verificar agora</button></div>`}function profile(){return`<div class="head"><small style="color:var(--mut)">Conta deste aparelho</small><h2>Perfil</h2></div><div class="card"><b>Usuário</b><p style="color:var(--mut)">${S.user}</p><button class="btn secondary" id="logout">Sair</button></div>`}function events(){$('#go')?.addEventListener('click',()=>nav('work'));$('#start')?.addEventListener('click',start);$('#finish')?.addEventListener('click',finish);$$('.open').forEach(b=>b.onclick=()=>openEx(+b.dataset.i));$('#setgym')?.addEventListener('click',setGym);$('#check')?.addEventListener('click',()=>check(true));$('#logout')?.addEventListener('click',()=>{localStorage.removeItem('nt_session');location.reload()});$('#rr')?.addEventListener('input',e=>{S.data.set.rest=+e.target.value;$('#rv').textContent=delta(+e.target.value);save()});$('#gr')?.addEventListener('input',e=>{S.data.gym.radius=+e.target.value;$('#gv').textContent=e.target.value+' m';save()})}function delta(v){return v?`${v>0?'+':''}${v}s`:'Padrão'}function rest(v){return Math.max(15,v+(S.data.set.rest||0))}function start(){let id=wid();S.data.active={id,start:Date.now(),done:{},loc:S.loc==='in'};save();render();toast('Treino '+id+' iniciado.')}function finish(){let s=S.data.active;if(!s)return;s.end=Date.now();S.data.sessions.push(s);S.data.active=null;S.data.next=(S.data.next+1)%4;save();nav('home');toast('Treino concluído. Próximo treino reorganizado.')}function openEx(i){if(!S.data.active)start();let s=S.data.active,e=W[s.id].e[i],done=s.done[i]||0;S.modal={i,mode:'ready',at:0,end:0};$('#back').classList.remove('hide');$('#sheet').classList.remove('hide');$('#sheet').innerHTML=`<div class="handle"></div><div class="sheethead"><div><h3>${e[0]}</h3><p>Série ${Math.min(done+1,e[1])} de ${e[1]}</p></div><button class="close" id="x">×</button></div><div class="demo">${svg(true)}</div><div class="timer"><small id="tl">Pronto para iniciar</small><div class="time" id="tm">00:00</div><div class="actions" id="ac"><button class="btn primary full" id="goSet">Iniciar série</button></div></div>`;$('#x').onclick=close;$('#goSet').onclick=()=>{S.modal.mode='work';S.modal.at=Date.now();tick()};clearInterval(S.timer);S.timer=setInterval(tick,250)}function tick(){if(!S.modal)return;let s=S.data.active,e=W[s.id].e[S.modal.i],d=s.done[S.modal.i]||0,l=$('#tl'),t=$('#tm'),a=$('#ac');if(S.modal.mode==='work'){let z=Math.floor((Date.now()-S.modal.at)/1000);l.textContent='Série em execução';t.textContent=fmt(z);a.innerHTML='<button class="btn secondary" id="cancel">Cancelar</button><button class="btn primary" id="done">Concluir série</button>';$('#cancel').onclick=()=>{S.modal.mode='ready';tick()};$('#done').onclick=()=>{s.done[S.modal.i]=(s.done[S.modal.i]||0)+1;save();if(s.done[S.modal.i]>=e[1]){S.modal.mode='done'}else{S.modal.mode='rest';S.modal.end=Date.now()+rest(e[3])*1000}tick()}}else if(S.modal.mode==='rest'){let z=Math.max(0,Math.ceil((S.modal.end-Date.now())/1000));l.textContent='Descanso • próxima série';t.textContent=fmt(z);a.innerHTML='<button class="btn secondary" id="more">+15s</button><button class="btn primary" id="skip">Pular</button>';$('#more').onclick=()=>S.modal.end+=15000;$('#skip').onclick=()=>{S.modal.mode='ready';tick()};if(!z){beep();S.modal.mode='ready';tick()}}else if(S.modal.mode==='done'){l.textContent='Exercício concluído';t.textContent='✓';a.innerHTML='<button class="btn primary full" id="end">Voltar ao treino</button>';$('#end').onclick=close}else{l.textContent=d?`Próxima série ${d+1} de ${e[1]}`:'Pronto para iniciar';t.textContent='00:00';a.innerHTML='<button class="btn primary full" id="goSet">Iniciar série</button>';$('#goSet').onclick=()=>{S.modal.mode='work';S.modal.at=Date.now();tick()}}}function close(){clearInterval(S.timer);S.timer=null;S.modal=null;$('#back').classList.add('hide');$('#sheet').classList.add('hide');render()}function svg(big=false){return`<svg viewBox="0 0 200 200"><g fill="none" stroke-linecap="round"><path d="M35 170H165" stroke="#ffffff22" stroke-width="4"/><g class="motion"><circle cx="100" cy="48" r="13" fill="#d4ffe2" stroke="#082718" stroke-width="4"/><path d="M100 62L98 112M98 78L70 98M98 78L128 96M98 112L78 151M98 112L126 151" stroke="#d4ffe2" stroke-width="10"/><path d="M55 96H145M62 87V105M138 87V105" stroke="#ffcf84" stroke-width="7"/></g></g></svg>`}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function beep(){navigator.vibrate?.([180,80,180]);try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.1;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.3)}catch{}toast('Descanso concluído.')}async function pos(){return new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{enableHighAccuracy:true,timeout:12000}))}async function setGym(){try{toast('Obtendo localização…');let p=await pos();S.data.gym.lat=p.coords.latitude;S.data.gym.lng=p.coords.longitude;save();toast('Daytona CT definida neste local.');check(false)}catch{toast('Autorize a localização no Safari.')}}async function check(show){try{let p=await pos(),d=hav(p.coords.latitude,p.coords.longitude,S.data.gym.lat,S.data.gym.lng);S.dist=d;S.loc=d<=S.data.gym.radius?'in':'out';show&&toast(S.loc==='in'?'Presença confirmada.':`Você está a ${Math.round(d)} m da academia.`);render()}catch{show&&toast('Não foi possível obter a localização.')}}function hav(a,b,c,d){let r=6371000,q=x=>x*Math.PI/180,x=q(c-a),y=q(d-b),z=Math.sin(x/2)**2+Math.cos(q(a))*Math.cos(q(c))*Math.sin(y/2)**2;return 2*r*Math.asin(Math.sqrt(z))}function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function sessionsWeek(){let d=new Date,m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));m.setHours(0,0,0,0);let e=new Date(m);e.setDate(m.getDate()+7);return S.data.sessions.filter(s=>new Date(s.end)>=m&&new Date(s.end)<e)}function misses(){if(!S.data.sessions.length)return 0;let last=new Date(Math.max(...S.data.sessions.map(s=>s.end))),d=new Date(last);d.setHours(0,0,0,0);d.setDate(d.getDate()+1);let t=new Date;t.setHours(0,0,0,0);let n=0;while(d<t){if([2,3,4,5,6].includes(d.getDay()))n++;d.setDate(d.getDate()+1)}return Math.min(n,6)}function toast(v){let e=$('#toast');e.textContent=v;e.classList.remove('hide');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hide'),2600)}$('#mode').onclick=()=>{};$('#form').onsubmit=auth;let session=localStorage.getItem('nt_session');session&&users()[session]?login(session):($('#auth').classList.remove('hide'));if(!session){$('#mode').onclick=()=>{S.mode=S.mode==='login'?'create':'login';$('#submit').textContent=S.mode==='login'?'Entrar':'Criar conta';$('#mode').textContent=S.mode==='login'?'Criar conta neste iPhone':'Já tenho conta';$('#msg').textContent=''}};</script></body></html>
